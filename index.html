<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8e6bb0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>نظام إدارة العيادة</title>
<style>
:root{--bg:#fdf8fb;--card:#fff;--pink:#f8d7e6;--pink-strong:#e9a3c4;--mauve:#8e6bb0;--mauve-dark:#6b4a8c;--text:#3a2c45;--muted:#7d6e88;--bad:#d64545;--border:#eadcf0;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 2px 10px rgba(142,107,176,.08)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:10px 20px;border:0;border-radius:12px;background:var(--mauve);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn:active{background:var(--mauve-dark)} .btn:disabled{opacity:.55}
.btn.secondary{background:var(--pink);color:var(--mauve-dark)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
.field input{min-height:52px;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:16px;background:#fff;direction:ltr;text-align:left}
.field input:focus{outline:2px solid var(--pink-strong)}
.error{background:#fdecec;color:var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(90deg,var(--pink),#e9ddf5);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;background:#fff;color:var(--mauve-dark);font-weight:700;font-size:14px}
.muted{color:var(--muted)} h1,h2{margin:0 0 8px;color:var(--mauve-dark)}
.hidden{display:none!important}
</style>
</head>
<body>

<main id="login" class="wrap hidden" style="padding-top:60px">
  <div class="card">
    <h1>تسجيل الدخول</h1>
    <p class="muted" style="margin-top:0">نظام إدارة العيادة</p>
    <div id="loginError" class="error hidden" role="alert"></div>
    <form id="loginForm">
      <div class="field"><label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" required autocomplete="username" inputmode="email"></div>
      <div class="field"><label for="password">كلمة المرور</label>
        <input id="password" type="password" required autocomplete="current-password"></div>
      <button class="btn" id="loginBtn">دخول</button>
    </form>
  </div>
</main>

<div id="app" class="hidden">
  <header class="topbar">
    <div><strong id="uname"></strong> <span class="badge" id="urole"></span></div>
    <button class="btn secondary" id="logout" style="width:auto;min-height:40px;padding:6px 16px">خروج</button>
  </header>
  <main class="wrap">
    <div class="card">
      <h2>تم الدخول بنجاح ✅</h2>
      <p>المرحلة الأولى (قاعدة البيانات والصلاحيات) تعمل. لوحة التحكم تأتي في المرحلة الثانية.</p>
    </div>
  </main>
</div>

<main id="setup" class="wrap hidden" style="padding-top:60px">
  <div class="card"><h2>الإعداد غير مكتمل</h2>
  <p>ملف <code>config.js</code> لا يحتوي على بيانات مشروع Supabase.</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const show = (id) => { ['login','app','setup'].forEach(x => $(x).classList.toggle('hidden', x !== id)); };
  const cfg = window.APP_CONFIG || {};

  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.startsWith('PUT_') || !window.supabase) { show('setup'); return; }

  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });

  function loginError(msg) { const e = $('loginError'); e.textContent = msg; e.classList.toggle('hidden', !msg); }

  async function enter(session) {
    const { data: profile } = await sb.from('profiles').select('full_name, role, active').eq('id', session.user.id).single();
    if (!profile || !profile.active) {
      await sb.auth.signOut(); show('login');
      loginError('هذا الحساب غير مفعّل. تواصل مع المدير'); return;
    }
    $('uname').textContent = profile.full_name || session.user.email;
    $('urole').textContent = profile.role === 'admin' ? 'مدير' : 'موظف استقبال';
    show('app');
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); loginError(''); $('loginBtn').disabled = true; $('loginBtn').textContent = 'جارٍ الدخول...';
    const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    $('loginBtn').disabled = false; $('loginBtn').textContent = 'دخول';
    if (error || !data.session) { loginError('البريد الإلكتروني أو كلمة المرور غير صحيحة'); return; }
    $('password').value = '';
    enter(data.session);
  });

  $('logout').addEventListener('click', async () => { await sb.auth.signOut(); show('login'); });

  sb.auth.getSession().then(({ data }) => { if (data.session) enter(data.session); else show('login'); });
})();
</script>
</body>
</html>
