<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#8e6bb0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>نظام إدارة العيادة</title>
<style>
:root{--bg:#fdf8fb;--card:#fff;--pink:#f8d7e6;--pink2:#e9a3c4;--mauve:#8e6bb0;--dark:#6b4a8c;--text:#3a2c45;--muted:#7d6e88;--bad:#d64545;--ok:#2e9e6b;--warn:#c98a12;--border:#eadcf0;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;min-height:100vh}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:0 2px 10px rgba(142,107,176,.08);margin-bottom:12px}
h1,h2,h3{margin:0 0 8px;color:var(--dark)} h3{font-size:17px}
.muted{color:var(--muted);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:8px 16px;border:0;border-radius:12px;background:var(--mauve);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn:active{background:var(--dark)} .btn:disabled,.b:disabled{opacity:.5}
.btn.sec{background:var(--pink);color:var(--dark)}
.b{min-height:44px;padding:6px 14px;border:0;border-radius:10px;background:var(--mauve);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.b.sec{background:var(--pink);color:var(--dark)} .b.danger{background:#fdecec;color:var(--bad)} .b.ok{background:var(--ok)} .b.warn{background:#fff3d6;color:var(--warn)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:700;font-size:15px}
input,select,textarea{min-height:48px;padding:8px 12px;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:16px;background:#fff;width:100%;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pink2)}
.ltr{direction:ltr;text-align:left}
.error{background:#fdecec;color:var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(90deg,var(--pink),#e9ddf5);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.badge{display:inline-block;padding:0 10px;border-radius:999px;background:#fff;color:var(--dark);font-weight:700;font-size:13px}
.pagehead{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-right:6px solid var(--c,var(--mauve));border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:20px;font-weight:800;color:var(--c,var(--dark))}
.pagehead small{font-size:13px;font-weight:600;color:var(--muted);margin-right:auto}
.chip{display:inline-block;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:#eee;color:#555}
.chip.waiting{background:#fff3d6;color:var(--warn)} .chip.arrived{background:#d8f0e4;color:var(--ok)}
.chip.in_progress{background:#e4dbf5;color:var(--dark)} .chip.finished{background:#e8e8e8;color:#666}
.chip.skipped{background:#ffe6cf;color:#b8631a} .chip.cancelled{background:#fdecec;color:var(--bad)}
.chip.postponed{background:#e1effc;color:#2b6cb0}
.chip.unpaid{background:#fdecec;color:var(--bad)} .chip.partial{background:#fff3d6;color:var(--warn)} .chip.paid{background:#d8f0e4;color:var(--ok)}
.chip.preg{background:#fde4f0;color:#b03a7a}
.doc{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:var(--r);padding:14px;color:#fff;margin-bottom:12px}
.doc.on{background:var(--ok)} .doc.off{background:var(--bad)} .doc strong{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--dark)} .stat span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.visit{display:flex;gap:12px}
.qn{min-width:54px;height:54px;border-radius:50%;background:var(--pink);color:var(--dark);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center}
.vbody{flex:1;min-width:0} .vname{font-weight:800;font-size:17px}
.money{font-size:14px;color:var(--muted);margin:2px 0 8px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;background:#fff;border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -4px 14px rgba(142,107,176,.12)}
.nav button{flex:1;border:0;background:#f6f1f9;border-radius:12px;padding:6px 2px;font:inherit;font-size:13px;font-weight:800;color:#6a5a76;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.nav button i{font-style:normal;font-size:22px}
.nav button.on{background:var(--c);color:#fff}
.modal{position:fixed;inset:0;background:rgba(40,25,50,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:12px;z-index:20;max-width:92%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.cur{display:flex;gap:8px;margin-bottom:12px}
.cur div{flex:1;background:#fff;border:1px solid var(--border);border-radius:12px;text-align:center;padding:6px}
.cur b{font-size:26px;color:var(--dark);display:block;line-height:1.2}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.seg{display:flex;gap:6px;margin:6px 0 10px}
.seg button{flex:1;border:2px solid var(--border);background:#fff;border-radius:12px;padding:8px 4px;font:inherit;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer;line-height:1.3}
.seg button b{display:block;font-size:20px}
.seg button.on{border-color:var(--c);background:var(--c);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chips button{flex:none;border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:700;color:var(--dark);cursor:pointer}
.chips button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:6px 5px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:#faf3fc;color:var(--dark)}
a.b{display:inline-flex;align-items:center;text-decoration:none}
@media print{.nav,.topbar,.noprint,.modal,.toast{display:none!important} body{background:#fff} .wrap{padding:0;max-width:none} .card{box-shadow:none}}
</style>
</head>
<body>

<main id="login" class="wrap hidden" style="padding-top:60px">
  <div class="card">
    <h1>تسجيل الدخول</h1>
    <p class="muted" style="margin-top:0">نظام إدارة العيادة</p>
    <div id="loginError" class="error hidden" role="alert"></div>
    <form id="loginForm">
      <div class="field"><label for="email">البريد الإلكتروني</label>
        <input id="email" class="ltr" type="email" required autocomplete="username" inputmode="email"></div>
      <div class="field"><label for="password">كلمة المرور</label>
        <input id="password" class="ltr" type="password" required autocomplete="current-password"></div>
      <button class="btn" id="loginBtn">دخول</button>
    </form>
  </div>
</main>

<div id="app" class="hidden">
  <header class="topbar">
    <div><strong id="uname"></strong> <span class="badge" id="urole"></span></div>
    <button class="b sec" id="logout">خروج</button>
  </header>
  <main class="wrap" id="main"></main>
  <nav class="nav" id="nav"></nav>
</div>

<main id="setup" class="wrap hidden" style="padding-top:60px">
  <div class="card"><h2>الإعداد غير مكتمل</h2><p>ملف <code>config.js</code> لا يحتوي على بيانات مشروع Supabase.</p></div>
</main>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const cfg = window.APP_CONFIG || {};
const showScreen = (id) => ['login','app','setup'].forEach(x => $(x).classList.toggle('hidden', x !== id));
if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.startsWith('PUT_') || !window.supabase) { showScreen('setup'); return; }
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// ---------- أدوات ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPE = { exam: 'كشف', consult: 'استشارة' };
const STATUS = { waiting:'منتظرة', arrived:'حضرت العيادة', in_progress:'جاري الكشف', finished:'تم الكشف', skipped:'تم تخطي الدور', cancelled:'ملغي' };
const PAYM = { cash:'كاش', visa:'فيزا', instapay:'إنستا باي' };
const PAYS = { unpaid:'لم يُدفع', partial:'مدفوع جزئيًا', paid:'مدفوع بالكامل' };
const PREG = { pregnant:'حامل', not_pregnant:'لا يوجد حمل', unknown:'لم يتحدد حتى الآن' };
const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const TABS = { today:['📋','اليوم','#8e6bb0'], book:['➕','حجز جديد','#2e9e6b'], patients:['👩','المريضات','#2b6cb0'], followup:['📞','المتابعة','#0f8b8d'], admin:['⚙️','الإدارة','#4a5568'], schedule:['📅','المواعيد','#c98a12'], accounts:['💰','الحسابات','#c2397a'], staff:['👥','الموظفون','#4a5568'], audit:['🧾','سجل العمليات','#4a5568'] };
const SUB = ['schedule', 'accounts', 'staff', 'audit'];
const money = (n) => Number(n || 0).toLocaleString('en-US') + ' ج';
const todayStr = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Cairo' });
const fmtDate = (d) => { if (!d) return ''; const [y,m,dd] = String(d).split('-'); return dd + '/' + m + '/' + y; };
const fmtTime = (t) => t ? new Date(t).toLocaleString('ar-EG', { timeZone: 'Africa/Cairo', dateStyle: 'short', timeStyle: 'short' }) : '';
const dayName = (d) => DAYS[new Date(d + 'T12:00:00Z').getUTCDay()];
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function waLink(phone, text) {
  let d = String(phone || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0')) d = '20' + d.slice(1);
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text);
}
const trackUrl = (v) => new URL('t.html', location.href).href.split('#')[0] + '#' + v.tracking_token;
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok; }
}
let toastTimer;
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 4500); }
const errMsg = (e) => (e && e.message) ? e.message : 'حدث خطأ غير متوقع';
async function rpc(name, args) { const { data, error } = await sb.rpc(name, args || {}); if (error) throw error; return data; }
async function q(promise) { const { data, error } = await promise; if (error) throw error; return data; }
const head = (tab, extra) => { const [i, l, c] = TABS[tab]; return (SUB.includes(tab) ? '<button class="b sec noprint" data-tab="admin" style="margin-bottom:10px">← الإدارة</button>' : '') + `<div class="pagehead" style="--c:${c}"><span>${i}</span> ${l}${extra ? `<small>${extra}</small>` : ''}</div>`; };

const state = { user: null, profile: null, tab: 'today', date: todayStr(), visits: [], acc: {}, sum: {}, qs: {}, doctor: null,
  modalVisit: null, picked: null, found: [], sec: 'remaining', filter: 'all',
  acct: { mode: 'month', anchor: todayStr(), from: todayStr(), to: todayStr() }, report: null };
const isAdmin = () => !!(state.profile && state.profile.role === 'admin');
const can = (k) => isAdmin() || !!((state.profile && state.profile.permissions) || {})[k];
const canMoney = () => can('manage_payments') || can('view_money');
const canFollow = () => can('view_history') || can('view_money') || can('manage_queue');
state.staff = []; state.staffMap = {};
state.fu = { kind: null, days: 30, list: [] };
state.audit = { from: addDays(todayStr(), -7), to: todayStr(), table: '', actor: '', rows: [], before: null, more: false, ctx: { patients: {}, visits: {}, payments: {} } };

// ---------- الدخول ----------
function loginError(m) { const e = $('loginError'); e.textContent = m; e.classList.toggle('hidden', !m); }
async function enter(session) {
  const { data: p } = await sb.from('profiles').select('full_name, role, active, permissions').eq('id', session.user.id).single();
  if (!p || !p.active) { await sb.auth.signOut(); showScreen('login'); loginError('هذا الحساب غير مفعّل. تواصل مع المدير'); return; }
  state.user = session.user; state.profile = p;
  $('uname').textContent = p.full_name || session.user.email;
  $('urole').textContent = p.role === 'admin' ? 'مدير' : 'موظف استقبال';
  showScreen('app'); go('today'); startLive();
}
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); loginError(''); $('loginBtn').disabled = true; $('loginBtn').textContent = 'جارٍ الدخول...';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  $('loginBtn').disabled = false; $('loginBtn').textContent = 'دخول';
  if (error || !data.session) { loginError('البريد الإلكتروني أو كلمة المرور غير صحيحة'); return; }
  $('password').value = ''; enter(data.session);
});
$('logout').addEventListener('click', async () => { stopLive(); await sb.auth.signOut(); showScreen('login'); });

// ---------- التنقل ----------
function navKeys() {
  const k = ['today'];
  if (can('book')) k.push('book');
  if (can('view_history') || can('edit_patients')) k.push('patients');
  if (canFollow()) k.push('followup');
  if (isAdmin()) k.push('admin');
  return k;
}
function renderNav() {
  const cur = SUB.includes(state.tab) ? 'admin' : state.tab;
  $('nav').innerHTML = navKeys().map(k => `<button data-tab="${k}" style="--c:${TABS[k][2]}" class="${cur === k ? 'on' : ''}"><i>${TABS[k][0]}</i>${TABS[k][1]}</button>`).join('');
}
function go(tab) {
  if (['admin', 'schedule', 'accounts', 'staff', 'audit'].includes(tab) && !isAdmin()) tab = 'today';
  if (tab === 'book' && !can('book')) tab = 'today';
  if (tab === 'patients' && !(can('view_history') || can('edit_patients'))) tab = 'today';
  if (tab === 'followup' && !canFollow()) tab = 'today';
  state.tab = tab; renderNav(); window.scrollTo(0, 0);
  ({ today: renderToday, book: renderBook, patients: renderPatients, followup: renderFollow, admin: renderAdmin, schedule: renderSchedule, accounts: renderAccounts, staff: renderStaff, audit: renderAudit })[tab]();
}

// ---------- التحديث المباشر ----------
let channel, poll, refreshT;
function softRefresh() {
  clearTimeout(refreshT);
  refreshT = setTimeout(() => {
    if (state.tab === 'today' && $('modal').classList.contains('hidden')) renderToday(true);
    if (state.modalVisit && !$('modal').classList.contains('hidden')) openPay(state.modalVisit, true);
  }, 400);
}
function startLive() {
  stopLive();
  channel = sb.channel('live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'visits' }, softRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'payments' }, softRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'doctor_status' }, softRefresh)
    .subscribe();
  poll = setInterval(softRefresh, 20000);
}
function stopLive() { if (channel) sb.removeChannel(channel); channel = null; clearInterval(poll); }

// ---------- اليوم ----------
const isPost = (v) => v.status === 'cancelled' && !!v.postponed_to;
const REM = ['waiting', 'arrived', 'in_progress', 'skipped'];
function doctorPresent() { const d = state.doctor; return !!(d && d.arrived && d.status_date === todayStr()); }
function visitCard(v) {
  const showMoney = canMoney();
  const a = state.acc[v.id] || { fee: v.fee, paid: 0, remaining: v.fee, pay_status: v.fee > 0 ? 'unpaid' : 'paid' };
  const p = v.patients || {};
  const isToday = state.date === todayStr();
  const Q = can('manage_queue'), C = can('cancel_visits');
  const st = (to, label, cls) => `<button class="b ${cls || ''}" data-act="status" data-id="${v.id}" data-to="${to}">${label}</button>`;
  const post = can('postpone') ? `<button class="b warn" data-act="postpone" data-id="${v.id}">تأجيل لموعد آخر</button>` : '';
  const cancel = C ? st('cancelled', 'إلغاء', 'danger') : '';
  let btns = '';
  if (v.status === 'waiting')     btns += (Q && isToday ? st('arrived', 'تسجيل الحضور', 'ok') : '') + (Q ? st('skipped', 'تخطي', 'sec') : '') + post + cancel;
  if (v.status === 'arrived')     btns += (Q && isToday ? st('in_progress', 'بدء الكشف', 'ok') : '') + (Q ? st('skipped', 'تخطي', 'sec') : '') + post + cancel;
  if (v.status === 'in_progress') btns += Q ? st('finished', 'إنهاء الكشف', 'ok') : '';
  if (v.status === 'skipped')     btns += (Q ? st('waiting', 'إعادة للانتظار', 'sec') : '') + post + cancel;
  if (v.status === 'cancelled' && !v.postponed_to) btns += Q ? st('waiting', 'إعادة للانتظار', 'sec') : '';
  if (showMoney) btns += `<button class="b sec" data-act="pay" data-id="${v.id}">الحساب</button>`;
  if (!v.link_closed_at) btns += `<button class="b sec" data-act="copylink" data-id="${v.id}">🔗 نسخ الرابط</button>`;
  btns += `<button class="b sec" data-act="wa" data-id="${v.id}">واتساب</button>`;
  const stChip = isPost(v) ? `<span class="chip postponed">مؤجل إلى ${fmtDate(v.postponed_to_date)}</span>` : `<span class="chip ${v.status}">${STATUS[v.status]}</span>`;
  return `<div class="card visit"><div class="qn">${v.queue_no}</div><div class="vbody">
    <div class="vname" ${can('view_history') || can('edit_patients') ? `data-act="profile" data-pid="${v.patient_id}" style="cursor:pointer"` : ''}>${esc(p.full_name)}</div>
    <div class="muted">${TYPE[v.visit_type]} · حجز ${v.booking_no} · ${esc(p.phone)}</div>
    <div style="margin:4px 0">${stChip} ${showMoney ? `<span class="chip ${a.pay_status}">${PAYS[a.pay_status]}</span>` : ''} <span class="chip preg">🤰 ${PREG[v.pregnancy_status] || ''}</span></div>
    ${v.postponed_from_date ? `<div class="muted">↪ مؤجل من ${fmtDate(v.postponed_from_date)}</div>` : ''}
    ${isPost(v) || !showMoney ? '' : `<div class="money">القيمة ${money(a.fee)} · المدفوع ${money(a.paid)} · المتبقي ${money(a.remaining)}</div>`}
    ${v.admin_notes ? `<div class="muted">📝 ${esc(v.admin_notes)}</div>` : ''}
    <div class="row">${btns}</div></div></div>`;
}
async function renderToday(silent) {
  const main = $('main');
  if (!silent) main.innerHTML = head('today') + '<p class="muted">جارٍ التحميل...</p>';
  try {
    const d = state.date;
    const [vis, sum, qs, doc] = await Promise.all([
      q(sb.from('visits').select('*, patients(full_name, phone, patient_no)').eq('visit_date', d).order('queue_no')),
      rpc('day_summary', { p_date: d }), rpc('queue_state', { p_date: d }),
      q(sb.from('doctor_status').select('*').eq('id', 1).single())
    ]);
    state.visits = vis; state.sum = sum; state.qs = qs; state.doctor = doc; state.acc = {};
    if (vis.length) (await q(sb.from('visit_accounts').select('*').in('visit_id', vis.map(v => v.id)))).forEach(a => state.acc[a.visit_id] = a);
    paintToday();
  } catch (e) { if (!silent) $('main').innerHTML = head('today') + `<div class="error">${esc(errMsg(e))}</div>`; else toast(errMsg(e), true); }
}
function paintToday() {
  if (state.tab !== 'today') return;
  const d = state.date, s = state.sum, qs = state.qs, vis = state.visits;
  const on = doctorPresent();
  const rem = vis.filter(v => REM.includes(v.status));
  const done = vis.filter(v => v.status === 'finished');
  const canc = vis.filter(v => v.status === 'cancelled' && !v.postponed_to);
  const post = vis.filter(isPost);
  const F = { all: rem, present: rem.filter(v => v.status === 'arrived' || v.status === 'in_progress'), absent: rem.filter(v => v.status === 'waiting'),
              skipped: rem.filter(v => v.status === 'skipped'), postponed: post };
  const FL = { all: 'الجميع', present: 'المتواجدات الآن', absent: 'لم يتم الحضور', skipped: 'تم التخطي', postponed: 'تم التأجيل لموعد آخر' };
  const adminBtns = isAdmin() ? `<div class="row" style="margin-bottom:12px">
    <button class="b ok" data-act="doctor" data-ev="arrived">وصلت الدكتورة</button>
    <button class="b sec" data-act="doctor" data-ev="reception_started">بدء الاستقبال</button>
    <button class="b sec" data-act="doctor" data-ev="work_ended">انتهاء العمل</button>
    <button class="b danger" data-act="doctor" data-ev="not_arrived">لم تصل</button></div>` : '';
  const dr = state.doctor;
  const times = dr.status_date === todayStr()
    ? [dr.arrived_at && 'وصلت ' + fmtTime(dr.arrived_at), dr.reception_started_at && 'بدأ الاستقبال ' + fmtTime(dr.reception_started_at), dr.work_ended_at && 'انتهى العمل ' + fmtTime(dr.work_ended_at)].filter(Boolean).join(' · ') : '';
  let list, empty;
  if (state.sec === 'done') { list = done; empty = 'لا توجد مريضات انتهى كشفهن بعد'; }
  else if (state.sec === 'cancelled') { list = canc; empty = 'لا توجد حجوزات ملغاة'; }
  else { list = F[state.filter]; empty = 'لا توجد مريضات في هذه القائمة'; }
  const segBtn = (k, label, n) => `<button data-act="sec" data-s="${k}" class="${state.sec === k ? 'on' : ''}" style="--c:${k === 'remaining' ? '#8e6bb0' : k === 'done' ? '#2e9e6b' : '#d64545'}"><b>${n}</b>${label}</button>`;
  $('main').innerHTML = head('today', dayName(d) + ' ' + fmtDate(d)) + `
    <div class="doc ${on ? 'on' : 'off'}"><strong>${on ? '🟢 الدكتورة وصلت العيادة' : '🔴 الدكتورة لم تصل بعد'}</strong></div>
    ${times ? `<p class="muted" style="margin-top:-6px">${esc(times)}</p>` : ''}${adminBtns}
    <div class="field"><label>اختيار يوم آخر</label><input type="date" id="dayPick" value="${d}"></div>
    <div class="cur"><div><b>${qs.current ?? '-'}</b><span class="muted">الدور الحالي</span></div>
      <div><b>${qs.next ?? '-'}</b><span class="muted">الدور التالي</span></div>
      <div><b>${qs.waiting_count}</b><span class="muted">منتظرات</span></div></div>
    ${d === todayStr() && can('manage_queue') ? '<button class="btn" data-act="callnext" style="margin-bottom:12px">استدعاء الدور التالي</button>' : ''}
    <div class="grid">
      <div class="stat"><b>${s.total}</b><span>حجوزات اليوم</span></div>
      <div class="stat"><b>${s.arrived}</b><span>حضرن</span></div>
      <div class="stat"><b>${s.in_progress}</b><span>جاري الكشف</span></div>
      <div class="stat"><b>${s.finished}</b><span>تم الكشف</span></div>
      <div class="stat"><b>${s.exams}</b><span>كشوف</span></div>
      <div class="stat"><b>${s.consults}</b><span>استشارات</span></div>
      ${can('view_money') ? `<div class="stat"><b>${money(s.collected)}</b><span>المحصّل اليوم</span></div>
      <div class="stat"><b>${money(s.outstanding)}</b><span>المتبقي</span></div>` : ''}
      <div class="stat"><b>${s.patients_total}</b><span>إجمالي المريضات</span></div></div>
    <div class="seg">${segBtn('remaining', 'الأدوار المتبقية', rem.length)}${segBtn('done', 'تم الكشف', done.length)}${segBtn('cancelled', 'تم الإلغاء', canc.length)}</div>
    ${state.sec === 'remaining' ? `<div class="chips">${Object.keys(FL).map(k => `<button data-act="flt" data-f="${k}" class="${state.filter === k ? 'on' : ''}">${FL[k]} (${F[k].length})</button>`).join('')}</div>` : ''}
    ${list.length ? list.map(visitCard).join('') : `<div class="card muted">${empty}</div>`}`;
}

        <div class="field"><label>المبلغ</label><input id="pamt" type="number" min="1" step="1" max="${a.remaining}" value="${a.remaining}" inputmode="numeric" required></div>

// ---------- الحسابات والتصدير (للمدير فقط) ----------
function rangeFor(mode, a) {
  if (mode === 'day') return [a, a];
  if (mode === 'week') { const dow = new Date(a + 'T12:00:00Z').getUTCDay(); const from = addDays(a, -((dow + 1) % 7)); return [from, addDays(from, 6)]; }   // الأسبوع يبدأ السبت
  if (mode === 'month') { const [y, m] = a.split('-'); const last = new Date(Date.UTC(+y, +m, 0)).getUTCDate(); return [`${y}-${m}-01`, `${y}-${m}-${String(last).padStart(2, '0')}`]; }
  if (mode === 'year') { const y = a.slice(0, 4); return [`${y}-01-01`, `${y}-12-31`]; }
  return [state.acct.from, state.acct.to];
}
const MODES = { day: 'يومي', week: 'أسبوعي', month: 'شهري', year: 'سنوي', custom: 'فترة مخصصة' };

const AUD_TABLES = { patients: 'المريضات', visits: 'الحجوزات', payments: 'الدفعات', profiles: 'الموظفون', weekly_schedule: 'مواعيد العمل', schedule_exceptions: 'الإجازات', doctor_status: 'حالة الدكتورة' };
const FLD = { full_name: 'الاسم', phone: 'الهاتف', admin_notes: 'ملاحظات', status: 'الحالة', fee: 'القيمة', visit_date: 'تاريخ الزيارة', queue_no: 'رقم الدور', visit_type: 'النوع', pregnancy_status: 'الحمل', amount: 'المبلغ', method: 'طريقة الدفع', voided_at: 'إلغاء الدفعة', void_reason: 'سبب الإلغاء', role: 'الدور الوظيفي', active: 'مفعّل', arrived: 'وصول الدكتورة', is_open: 'يوم عمل', start_time: 'من', end_time: 'إلى', postponed_to_date: 'مؤجل إلى', kind: 'النوع', exc_date: 'التاريخ', note: 'ملاحظة', email: 'البريد' };
const AUD_SKIP = new Set(['updated_at', 'arrived_at', 'started_at', 'finished_at', 'link_closed_at', 'tracking_token', 'postponed_to', 'postponed_from', 'postponed_from_date', 'status_date', 'updated_by', 'voided_by', 'phone_norm', 'created_by', 'paid_at', 'created_at', 'reception_started_at', 'work_ended_at']);
function fv(k, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (k === 'status') return STATUS[v] || v;
  if (k === 'visit_type') return TYPE[v] || v;
  if (k === 'method') return PAYM[v] || v;
  if (k === 'pregnancy_status') return PREG[v] || v;
  if (k === 'role') return v === 'admin' ? 'مدير' : 'موظف استقبال';
  if (typeof v === 'boolean') return v ? 'نعم' : 'لا';
  if (typeof v === 'object') return 'تعديل';
  if (typeof v === 'string' && /^\d{4}-\d\d-\d\dT/.test(v)) return fmtTime(v);
  if (typeof v === 'string' && /^\d{4}-\d\d-\d\d$/.test(v)) return fmtDate(v);
  return String(v);
}
function changes(r) {
  const o = r.old_data || {}, n = r.new_data || {}, out = [];
  Array.from(new Set(Object.keys(o).concat(Object.keys(n)))).forEach(k => {
    if (AUD_SKIP.has(k) || JSON.stringify(o[k]) === JSON.stringify(n[k])) return;
    if (k === 'permissions') {
      const po = o[k] || {}, pn = n[k] || {};
      Object.keys(PERM_LABELS).forEach(pk => { if (!!po[pk] !== !!pn[pk]) out.push(`صلاحية «${PERM_LABELS[pk]}»: ${po[pk] ? 'نعم' : 'لا'} ← ${pn[pk] ? 'نعم' : 'لا'}`); });

  });
  return out;
}
function auditTitle(r, ctx) {
  const t = r.table_name, n = r.new_data || {}, ins = r.action === 'INSERT';
  const vinfo = (id) => { const v = ctx.visits[id]; return v ? `${v.name} (دور ${v.queue_no} · ${fmtDate(v.visit_date)})` : ''; };
  if (t === 'patients') return ins ? `تسجيل مريضة جديدة: ${n.full_name}` : `تعديل بيانات مريضة: ${ctx.patients[r.record_id] || ''}`;
  if (t === 'visits') return ins ? `حجز جديد: ${ctx.patients[n.patient_id] || ''} (دور ${n.queue_no} · ${fmtDate(n.visit_date)})` : `تعديل حجز: ${vinfo(r.record_id)}`;
  if (t === 'payments') { const vid = n.visit_id || (ctx.payments[r.record_id] || {}).visit_id; return ins ? `تسجيل دفعة ${money(n.amount)} (${PAYM[n.method] || ''}) — ${vinfo(vid)}` : `تعديل دفعة — ${vinfo(vid)}`; }
  if (t === 'profiles') return ins ? 'إنشاء حساب موظف' : `تعديل حساب موظف: ${(state.staffMap[r.record_id] || {}).full_name || ''}`;

async function auditContext(rows) {
  const pids = new Set(), vids = new Set(), payids = new Set(), ctx = { patients: {}, visits: {}, payments: {} };
  rows.forEach(r => {
    const n = r.new_data || {};
    if (r.table_name === 'patients') pids.add(r.record_id);
    if (r.table_name === 'visits') { vids.add(r.record_id); if (n.patient_id) pids.add(n.patient_id); }
    if (r.table_name === 'payments') { if (n.visit_id) vids.add(n.visit_id); else payids.add(r.record_id); }
  });
  if (payids.size) (await q(sb.from('payments').select('id, visit_id').in('id', Array.from(payids)))).forEach(p => { ctx.payments[p.id] = p; vids.add(p.visit_id); });
  if (vids.size) (await q(sb.from('visits').select('id, queue_no, visit_date, patients(full_name)').in('id', Array.from(vids)))).forEach(v => { ctx.visits[v.id] = { name: v.patients.full_name, queue_no: v.queue_no, visit_date: v.visit_date }; });
  if (pids.size) (await q(sb.from('patients').select('id, full_name').in('id', Array.from(pids)))).forEach(p => { ctx.patients[p.id] = p.full_name; });

}

  return `أهلًا ${x.name}، لم نتمكن من رؤيتك في موعدك يوم ${fmtDate(x.visit_date)}، هل تودين تحديد موعد جديد؟`;
}

// ---------- النافذة المنبثقة ----------
function sheet(html) { $('sheet').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() {
  $('modal').classList.add('hidden'); state.modalVisit = null;
  if (state.tab === 'today') renderToday(true); else if (state.tab === 'accounts') loadReport(); else if (state.tab === 'followup') loadFollow(); else if (state.tab === 'staff') renderStaff();
}
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });

// ---------- الأحداث ----------
let busy = false;
document.addEventListener('click', async (e) => {
  const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { go(tabBtn.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if (!el || busy) return;
  const act = el.dataset.act, id = el.dataset.id;
  busy = true; if (el.tagName === 'BUTTON') el.disabled = true;
  try {
    if (act === 'close') closeModal();
    else if (act === 'sec') { state.sec = el.dataset.s; paintToday(); }
    else if (act === 'flt') { state.filter = el.dataset.f; paintToday(); }
    else if (act === 'status') {
      const to = el.dataset.to;
      if (to === 'cancelled' && !confirm('هل أنتِ متأكدة من إلغاء الحجز؟')) return;
      await rpc('set_visit_status', { p_visit_id: id, p_new: to }); await renderToday(true);
    }
    else if (act === 'postpone') openPostpone(id);
    else if (act === 'callnext') { await rpc('call_next', { p_date: state.date }); await renderToday(true); }
    else if (act === 'doctor') { await rpc('set_doctor_status', { p_event: el.dataset.ev }); await renderToday(true); }
    else if (act === 'pay') { await openPay(id); }
    else if (act === 'profile') { await openProfile(el.dataset.pid); }
    else if (act === 'wa') {
      const v = state.visits.find(x => x.id === id); if (!v) return;
      const link = v.link_closed_at ? '' : ` لمتابعة دورك: ${trackUrl(v)}`;
      window.open(waLink(v.patients.phone, `أهلًا ${v.patients.full_name}، تم تأكيد حجزك يوم ${fmtDate(v.visit_date)}. رقم دورك: ${v.queue_no}.${link}`), '_blank', 'noopener');
    }
    else if (act === 'copylink') {
      const v = state.visits.find(x => x.id === id); if (!v) return;
      toast((await copyText(trackUrl(v))) ? 'تم نسخ رابط المتابعة ✅' : 'تعذر النسخ تلقائيًا', false);
    }
    else if (act === 'bsearch' || act === 'psearch') {
      const box = $(act === 'bsearch' ? 'bq' : 'pq'), out = $(act === 'bsearch' ? 'bres' : 'pres');
      out.innerHTML = '<p class="muted">جارٍ البحث...</p>';
      const list = await rpc('search_patients', { p_q: box.value });
      state.found = list; out.innerHTML = patientRows(list, act === 'bsearch' ? 'pickpat' : 'profile');
    }
    else if (act === 'pickpat') { state.picked = (state.found || []).find(p => p.id === el.dataset.pid) || null; renderBook(); }
    else if (act === 'unpick') { state.picked = null; renderBook(); }
    else if (act === 'void') {
      const reason = prompt('سبب إلغاء الدفعة:'); if (!reason) return;
      await rpc('void_payment', { p_payment_id: el.dataset.pid, p_reason: reason }); toast('تم إلغاء الدفعة'); await openPay(state.modalVisit);
    }
    else if (act === 'savewk') {
      const row = document.querySelector(`[data-row="${el.dataset.wd}"]`);
      const open = row.querySelector('.wo').checked, s = row.querySelector('.ws').value, en = row.querySelector('.we').value;
      if (open && (!s || !en)) { toast('حددي وقت البداية والنهاية', true); return; }
      await q(sb.from('weekly_schedule').update({ is_open: open, start_time: s || null, end_time: en || null }).eq('weekday', Number(el.dataset.wd)));
      toast('تم الحفظ');
    }
    else if (act === 'delexc') { if (!confirm('حذف هذا اليوم من الجدول؟')) return; await q(sb.from('schedule_exceptions').delete().eq('id', id)); renderSchedule(); }
    else if (act === 'acmode') { state.acct.mode = el.dataset.m; renderAccounts(); }
    else if (act === 'acload') {
      if (state.acct.mode === 'custom') { state.acct.from = $('acf').value; state.acct.to = $('act').value; } else if ($('aca').value) state.acct.anchor = $('aca').value;
      await loadReport();
    }
    else if (act === 'xlsx') exportReport();
    else if (act === 'print') window.print();
    else if (act === 'staffadd') openStaffAdd();
    else if (act === 'staffedit') openStaffEdit(id);
    else if (act === 'audload') { const A = state.audit; A.from = $('auf').value; A.to = $('aut').value; A.table = $('aus').value; A.actor = $('aua').value; await loadAudit(true); }
    else if (act === 'audmore') await loadAudit(false);
    else if (act === 'fukind') { state.fu.kind = el.dataset.k; renderFollow(); }
    else if (act === 'fubook') { const x = state.fu.list[Number(el.dataset.i)]; state.picked = { id: x.patient_id, full_name: x.name, phone: x.phone, patient_no: x.patient_no }; go('book'); }
    else if (act === 'fupost') { const x = state.fu.list[Number(el.dataset.i)]; openPostpone(x.visit_id, x.name); }
    else if (act === 'fucancel') {
      const x = state.fu.list[Number(el.dataset.i)];
      if (!confirm('إلغاء حجز ' + x.name + '؟')) return;
      await rpc('set_visit_status', { p_visit_id: x.visit_id, p_new: 'cancelled' }); toast('تم إلغاء الحجز'); await loadFollow();
    }
    else if (act === 'fuwa') { const x = state.fu.list[Number(el.dataset.i)]; window.open(waLink(x.phone, fuMessage(x)), '_blank', 'noopener'); }
  } catch (err) { toast(errMsg(err), true); }
  finally { busy = false; if (el.isConnected && el.tagName === 'BUTTON') el.disabled = false; }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'dayPick' && e.target.value) { state.date = e.target.value; renderToday(); }
  if (e.target.id === 'fud') { state.fu.days = Number(e.target.value); loadFollow(); }
});

document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault(); if (busy) return; busy = true;
  try {
    const kind = f.dataset.form;
    if (kind === 'book') {
      const p = state.picked;
      const name = p ? p.full_name : $('bn').value;
      const v = await rpc('create_visit', { p_patient_id: p ? p.id : null, p_full_name: p ? null : name, p_phone: p ? null : $('bp').value,
        p_visit_date: $('bd').value, p_visit_type: $('bt').value, p_fee: Number($('bf').value || 0), p_notes: $('bnotes').value || null, p_pregnancy: $('bpreg').value });
      state.picked = null; renderBook();          // نموذج فارغ جاهز لحجز آخر
      toast(`✅ تم حجز ${name} — رقم الدور ${v.queue_no} (${fmtDate(v.visit_date)})`);
    } else if (kind === 'pay') {
      await rpc('add_payment', { p_visit_id: f.dataset.id, p_amount: Number($('pamt').value), p_method: $('pmeth').value }); toast('تم تسجيل الدفعة'); await openPay(f.dataset.id);
    } else if (kind === 'fee') {
      await rpc('set_visit_fee', { p_visit_id: f.dataset.id, p_fee: Number($('feev').value) }); toast('تم تعديل القيمة'); await openPay(f.dataset.id);
    } else if (kind === 'postpone') {
      const n = await rpc('postpone_visit', { p_visit_id: f.dataset.id, p_new_date: $('ppd').value });
      closeModal(); toast(`تم التأجيل إلى ${fmtDate(n.visit_date)} برقم دور ${n.queue_no}`);
    } else if (kind === 'editpat') {
      await q(sb.from('patients').update({ full_name: $('en').value.trim(), phone: $('ep').value.trim(), admin_notes: $('eno').value || null }).eq('id', f.dataset.pid)); toast('تم الحفظ');
    } else if (kind === 'staffnew') {
      await callFn({ action: 'create', full_name: $('sn').value, email: $('se').value, password: $('sp').value, permissions: readPerms(f) });
      closeModal(); toast('تم إنشاء حساب الموظف ✅');
    } else if (kind === 'staffedit') {
      await q(sb.from('profiles').update({ full_name: $('sen').value.trim(), role: $('ser').value, active: $('sea').checked, permissions: readPerms(f) }).eq('id', f.dataset.id));
      closeModal(); toast('تم حفظ بيانات الموظف ✅');
    } else if (kind === 'staffpw') {
      await callFn({ action: 'reset_password', user_id: f.dataset.id, password: $('spw').value });
      toast('تم تغيير كلمة المرور ✅'); $('spw').value = '';
    } else if (kind === 'exc') {
      const k = $('xk').value;
      await q(sb.from('schedule_exceptions').insert({ exc_date: $('xd').value, kind: k, start_time: k === 'extra_open' ? $('xs').value : null, end_time: k === 'extra_open' ? $('xe').value : null, note: $('xn').value || null, created_by: state.user.id }));
      toast('تمت الإضافة'); renderSchedule();
    }
  } catch (err) { toast(errMsg(err), true); }
  finally { busy = false; }
});

sb.auth.getSession().then(({ data }) => { if (data.session) enter(data.session); else showScreen('login'); });
})();
</script>
</body>
</html>
